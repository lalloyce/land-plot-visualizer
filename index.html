<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta tags for character set and viewport -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title of the page -->
    <title>Horseshoe Land Plot Visualizer</title>
    <!-- External stylesheets -->
    <link rel="stylesheet" href="css/style.css"> <!-- Ensure this path is correct -->
    <!-- External stylesheets -->
    <link rel="stylesheet" href="css/output.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.12.0/cdn.min.js" defer></script>
    <!-- Internal styles for the page -->
    <style>
        .plot {
            background-color: #FFD700;
            border: 1px solid #D4AF37;
        }
        .road {
            background-color: #4A4A4A;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
<!-- Main container for the page -->
<div class="container mx-auto p-8 bg-white rounded-lg shadow-md" x-data="plotVisualizer()">
    <!-- Title of the page -->
    <h1 class="text-3xl font-bold mb-6 text-center"> Plot Visualizer</h1>
    <!-- Form for inputting land size and unit -->
    <form id="layoutForm" class="mb-8">
        <div class="mb-4">
            <label for="landSize" class="block text-sm font-medium text-gray-700 mb-2">Land Size:</label>
            <input type="number" id="landSize" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="mb-4">
            <label for="unit" class="block text-sm font-medium text-gray-700 mb-2">Unit:</label>
            <select id="unit" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="acres">Acres</option>
                <option value="ha">Hectares</option>
                <option value="m2">Square Meters</option>
            </select>
        </div>
        <button type="submit" class="w-full bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600 transition duration-300">Generate Plot Layout</button>
    </form>
    <!-- Loading indicator -->
    <div x-show="loading" class="text-center">
        <p class="text-lg font-semibold">Generating horseshoe plot layout...</p>
    </div>
    <!-- Plot image and plot count -->
    <!-- Replace the existing plot image div with: -->
    <div x-show="loading" class="text-center">
        <p class="text-lg font-semibold">Generating plot layout...</p>
    </div>
    
    <div x-show="!loading" class="text-center">
        <canvas id="landCanvas" class="mx-auto mb-4 max-w-full h-auto"></canvas>
        <p class="text-lg font-semibold">Total number of plots: <span x-text="plotCount"></span></p>
    </div>
    
    <!-- Remove the fetch implementation and base64 image handling -->
    <canvas id="landCanvas" style="border:1px solid #000;"></canvas>
</div>

<!-- JavaScript for the page -->
<script src="js/script.js"></script> <!-- Ensure this path is correct -->
<script>
    function plotVisualizer() {
        return {
            landSize: 10,
            unit: 'acres',
            loading: false,
            plotImage: null,
            plotCount: 0,
            generatePlot() {
                this.loading = true;
                this.plotImage = null;
                this.plotCount = 0;

                const formData = new FormData();
                formData.append('land_size', this.landSize);
                formData.append('unit', this.unit);

                fetch('/generate', {
                    method: 'POST',
                    body: formData
                })
                    .then(response => response.json())
                    .then(data => {
                        this.plotImage = data.image;
                        this.plotCount = data.plot_count;
                        this.loading = false;
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        this.loading = false;
                    });
            }
        }
    }
</script>
</body>
</html>
